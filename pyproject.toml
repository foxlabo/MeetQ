[project]
name = "meetq"
version = "0.1.0"
description = "Local web app that transcribes meeting/video audio and generates AI questions about it."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.115)",
    "uvicorn[standard] (>=0.30)",
    "sqlalchemy (>=2.0)",
    "openai (>=1.60)",
    "python-multipart (>=0.0.9)",
    "pydantic (>=2.7)",
    "pydantic-settings (>=2.3)",
    "python-dotenv (>=1.0)",
    "av (>=12.0)",
    "numpy (>=1.26)",
    "rapidfuzz (>=3.9)",
    "webrtcvad-wheels (>=2.0.14)",
    "PyAudioWPatch (>=0.2.12.7) ; sys_platform == 'win32'",
    "websockets (>=12.0)",
]

[project.scripts]
meetq = "meetq.cli:main"

[tool.poetry]
packages = [{ include = "meetq" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-asyncio = ">=0.23"
ruff = ">=0.5"
httpx = ">=0.27"
playwright = ">=1.45"
pytest-playwright = ">=0.5"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["frontend", "meetq/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "t1: unit tests",
    "t2: STT integration (real API)",
    "t3: loopback E2E (real API + audio devices)",
    "t4: API E2E (real API)",
    "t5: UI E2E (Playwright + real API)",
    "t6: realtime E2E (Phase 2)",
]
asyncio_mode = "auto"
